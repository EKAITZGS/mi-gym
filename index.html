<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://ekaitzgs.github.io/mi-gym/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0b0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mi Gym" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Mi Gym</title>
    <script>window.__t0 = performance.now()</script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="sp-logo" viewBox="0 0 1024 1024" width="148" height="148">
        <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ff5b0"/><stop offset="1" stop-color="#1fc778"/></linearGradient></defs>
        <circle cx="512" cy="512" r="330" fill="none" stroke="#1d2621" stroke-width="56"/>
        <circle class="sp-ring" cx="512" cy="512" r="330" fill="none" stroke="url(#sg)" stroke-width="56" stroke-linecap="round"
          stroke-dasharray="1492.9 2073.5" transform="rotate(-90 512 512)" style="--c:1492.9"/>
        <g class="sp-db"><g transform="translate(512 512) rotate(-45) scale(0.62)" fill="url(#sg)">
<rect x="-300" y="-46" width="600" height="92" rx="46"/>
<rect x="-262" y="-170" width="96" height="340" rx="48"/><rect x="166" y="-170" width="96" height="340" rx="48"/>
<rect x="-352" y="-112" width="72" height="224" rx="36"/><rect x="280" y="-112" width="72" height="224" rx="36"/></g></g>
      </svg>
      <div class="sp-name">Mi Gym</div>
      <div class="sp-sub">Entrena · Come · Progresa</div>
    </div>
    <style>
      #splash { position: fixed; inset: 0; z-index: 2000; background: radial-gradient(90% 60% at 50% 40%, #12241b 0%, #0a0b0e 70%);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; transition: opacity .4s ease, transform .4s ease; }
      #splash.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
      .sp-name { color: #f4f5f7; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; }
      .sp-sub { color: #858b98; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
      @media (prefers-reduced-motion: no-preference) {
        .sp-ring { animation: spRing .9s cubic-bezier(.65,0,.35,1) both; }
        .sp-db { transform-origin: 512px 512px; animation: spDb .6s .35s cubic-bezier(.2,1.4,.4,1) both; }
        .sp-logo { animation: spLogo .5s ease both; filter: drop-shadow(0 0 24px rgba(62,224,143,.35)); }
        .sp-name { animation: spUp .5s .55s ease both; }
        .sp-sub { animation: spUp .5s .7s ease both; }
        @keyframes spRing { from { stroke-dashoffset: var(--c); } to { stroke-dashoffset: 0; } }
        @keyframes spDb { from { transform: scale(.2) rotate(-90deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
        @keyframes spLogo { from { transform: scale(.85); opacity: 0; } }
        @keyframes spUp { from { transform: translateY(10px); opacity: 0; } }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
